<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter – Formal Letter Composer</title>
    <!-- Google Fonts for Logo and fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Quill -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <!-- html2canvas and jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Top Navigation Bar -->
        <header class="top-bar glass">
            <div class="logo-area">
                <span class="logo-text" data-i18n="appName">Letter</span>
            </div>
            <div class="top-actions">
                <button id="btn-undo" class="icon-btn" title="Undo"><i class="fas fa-undo"></i></button>
                <button id="btn-redo" class="icon-btn" title="Redo"><i class="fas fa-redo"></i></button>
                <div class="divider"></div>
                <select id="template-select" class="glass-select" title="Templates">
                    <!-- populated by JS -->
                </select>
                <button id="btn-save-template" class="btn-text" title="Save as Template"><i class="fas fa-save"></i> <span data-i18n="saveTemplate">Save Template</span></button>
                <button id="btn-export-import" class="btn-text" title="Export/Import Templates"><i class="fas fa-file-export"></i></button>
                <div class="divider"></div>
                <button id="btn-export-pdf" class="btn-primary"><i class="fas fa-file-pdf"></i> <span data-i18n="exportPdf">Export PDF</span></button>
                <button id="btn-print" class="icon-btn" title="Print"><i class="fas fa-print"></i></button>
                <button id="btn-theme" class="icon-btn" title="Toggle Theme"><i class="fas fa-moon"></i></button>
                <button id="btn-lang" class="icon-btn" title="Switch Language"><i class="fas fa-language"></i></button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Sidebar (Properties Panel) -->
            <aside class="sidebar glass">
                <div class="panel-section">
                    <h3 data-i18n="properties">Properties</h3>
                    <div class="property-group">
                        <label data-i18n="rectangle">Rectangle</label>
                        <select id="rect-select">
                            <option value="header">Header</option>
                            <option value="body">Body</option>
                        </select>
                    </div>
                    <div class="property-group">
                        <label data-i18n="fillColor">Fill Color</label>
                        <input type="color" id="fill-color" value="#ffffff">
                    </div>
                    <div class="property-group">
                        <label data-i18n="borderColor">Border Color</label>
                        <input type="color" id="border-color" value="#000000">
                    </div>
                    <div class="property-group">
                        <label data-i18n="borderWidth">Border Width (px)</label>
                        <input type="number" id="border-width" min="0" max="10" step="1" value="2">
                    </div>
                    <div class="property-group">
                        <label data-i18n="cornerRadius">Corner Radius (px)</label>
                        <input type="number" id="corner-radius" min="0" max="50" step="1" value="0">
                    </div>
                </div>
                <div class="panel-section">
                    <h3 data-i18n="headerFields">Header Fields</h3>
                    <div class="property-group">
                        <label data-i18n="orgName">Organization Name</label>
                        <input type="text" id="org-name" placeholder="Organization">
                    </div>
                    <div class="property-group">
                        <label data-i18n="logoUrl">Logo URL</label>
                        <input type="text" id="logo-url" placeholder="https://...">
                    </div>
                    <div class="property-group">
                        <label data-i18n="date">Date</label>
                        <input type="date" id="letter-date">
                    </div>
                    <div class="property-group">
                        <label data-i18n="attachment">Attachment</label>
                        <select id="attachment">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <div class="property-group">
                        <label data-i18n="letterNumber">Letter Number</label>
                        <input type="text" id="letter-number" placeholder="e.g., 123/1402">
                    </div>
                </div>
            </aside>

            <!-- Canvas Area -->
            <section class="canvas-area">
                <div class="canvas-toolbar glass">
                    <div class="zoom-controls">
                        <button id="zoom-out" class="icon-btn"><i class="fas fa-search-minus"></i></button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in" class="icon-btn"><i class="fas fa-search-plus"></i></button>
                    </div>
                    <div class="canvas-info">
                        <span data-i18n="a4Canvas">A4 Canvas</span>
                    </div>
                </div>
                <div id="a4-container" class="a4-container">
                    <div id="a4-canvas" class="a4-canvas">
                        <!-- Rectangles will be appended here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="import-file" accept=".json" style="display:none">

    <!-- Quill editor toolbar hidden; we'll use custom toolbar -->
    <div id="editor-toolbar" class="editor-toolbar glass" style="display:none;">
        <select id="font-family" class="ql-font"></select>
        <select id="font-size" class="ql-size"></select>
        <button class="ql-bold" title="Bold"><i class="fas fa-bold"></i></button>
        <button class="ql-italic" title="Italic"><i class="fas fa-italic"></i></button>
        <button class="ql-underline" title="Underline"><i class="fas fa-underline"></i></button>
        <button class="ql-strike" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>
        <button class="ql-color" title="Text Color"><i class="fas fa-font"></i></button>
        <button class="ql-background" title="Highlight Color"><i class="fas fa-highlighter"></i></button>
        <button class="ql-align" value=""><i class="fas fa-align-left"></i></button>
        <button class="ql-align" value="center"><i class="fas fa-align-center"></i></button>
        <button class="ql-align" value="right"><i class="fas fa-align-right"></i></button>
        <button class="ql-align" value="justify"><i class="fas fa-align-justify"></i></button>
        <button class="ql-list" value="bullet"><i class="fas fa-list-ul"></i></button>
        <button class="ql-list" value="ordered"><i class="fas fa-list-ol"></i></button>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
